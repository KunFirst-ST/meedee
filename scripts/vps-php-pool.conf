[msu-food]
user = msufood
group = msufood
listen = /run/php/msu-food.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 512K
php_admin_value[post_max_size] = 512K
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/msu-food/current/storage/logs/php-error.log
