log_format msu_food_privacy '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name 103.114.201.109;
    location ^~ /.well-known/acme-challenge/ { root /srv/msu-food/acme; }
    location / { return 301 https://103.114.201.109$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 103.114.201.109;
    ssl_certificate /srv/msu-food/letsencrypt/live/msu-food-ip/fullchain.pem;
    ssl_certificate_key /srv/msu-food/letsencrypt/live/msu-food-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/msu-food/web;
    index index.html;
    client_max_body_size 512k;
    access_log /var/log/nginx/msu-food-access.log msu_food_privacy;
    error_log /var/log/nginx/msu-food-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://www.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /api/ { rewrite ^ /index.php last; }
    location /password/ { rewrite ^ /index.php last; }
    location = /up { rewrite ^ /index.php last; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/msu-food/current/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/msu-food/current/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/msu-food.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html { expires -1; }
    location = /flutter_bootstrap.js { expires -1; }
    location = /flutter_service_worker.js { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
