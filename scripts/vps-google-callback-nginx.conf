log_format msu_google_privacy '$remote_addr [$time_local] $request_method $status $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name msu-food.103.114.201.109.nip.io;
    location ^~ /.well-known/acme-challenge/ { root /srv/msu-food/acme; }
    location / { return 301 https://msu-food.103.114.201.109.nip.io$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name msu-food.103.114.201.109.nip.io;
    ssl_certificate /srv/msu-food/letsencrypt/live/msu-food-google/fullchain.pem;
    ssl_certificate_key /srv/msu-food/letsencrypt/live/msu-food-google/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/msu-google-callback-access.log msu_google_privacy;
    error_log /var/log/nginx/msu-google-callback-error.log warn;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = /api/v1/auth/google/callback {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/msu-food/current/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /srv/msu-food/current/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/msu-food.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
    location / { return 404; }
}
